services:
  app:
    build: .
    image: federated-learning-mlops:latest
    ports:
      - "8000:8000"
    environment:
      # keep the database and prediction CSVs on the host, so restarts keep state
      FEDFL_DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # one-shot: seed the database with three representative runs
  seed:
    build: .
    image: federated-learning-mlops:latest
    environment:
      FEDFL_DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
    working_dir: /app/backend
    command: ["python", "-m", "app.seed", "--reset"]
    profiles: ["seed"]
